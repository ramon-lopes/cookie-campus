<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c4036">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Estoque, reservas e vendas de cookies, mesmo sem internet.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Cookie Campus</title>
</head>
<body>
  <section id="access-screen" class="access-screen"><p>Carregando o Cookie Campus…</p></section>
  <div id="workspace-ui" hidden>
    <div class="shell">
      <header>
        <a class="brand" href="#hoje"><span class="brand-icon" aria-hidden="true">◉</span><span>cookie<span class="brand-light"> campus</span></span></a>
        <button class="icon-button" id="settings" aria-label="Configurações e backup">⚙︎</button>
      </header>
      <div class="connection" id="connection"></div>
      <main id="app" tabindex="-1">
        <div id="app-view"><p>Carregando seus cookies…</p></div>
        <div id="today-stock" hidden>
          <div class="section-title"><h2>Estoque por sabor</h2><button id="move">Movimentar estoque</button></div>
          <div class="grid stock-grid" id="stock-grid"></div>
          <div class="actions"><button id="share">Divulgar no WhatsApp</button><button id="close">Conferir e fechar dia</button></div>
        </div>
        <div id="history-view" hidden>
          <div class="heading"><h1>Histórico</h1><button id="backup">Backup</button></div>
          <section class="history-overview" aria-label="Resumo geral">
            <dl class="summary-grid" id="history-summary"></dl>
            <div id="history-overview-details"></div>
          </section>
          <div id="history-entries"></div>
        </div>
      </main>
    </div>
    <nav aria-label="Navegação principal">
      <button data-tab="hoje" aria-label="Hoje">◷<span>Hoje</span></button>
      <button data-tab="reservas" aria-label="Reservas">▤<span>Reservas</span></button>
      <button data-tab="historico" aria-label="Histórico">↺<span>Histórico</span></button>
    </nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button id="dismiss" class="icon-button" aria-label="Fechar">✕</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
